apiVersion: v1
kind: Pod
metadata:
  name: wombat
  namespace: monitoring
  labels:
    app: wombat
spec:
  {{- if .Values.wombatConfig.enabled }}
  initContainers:
  # Seed <hostPath>/config/wombat.config from the image on first start;
  # WombatOAM needs the file to exist and rewrites it in place.
  - name: seed-wombat-config
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
    command:
    - sh
    - -c
    - '[ -s /seed/wombat.config ] || cp /wombat/_build/default/rel/wombat/files/wombat.config /seed/wombat.config'
    volumeMounts:
    - mountPath: /seed
      name: wombat-config
  {{- end }}
  containers:
  - name: wombat
    {{- if .Values.resources }}
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    {{- end }}
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
    volumeMounts:
    - mountPath: /wombat/data
      name: wombat-data
    - mountPath: /wombat/log
      name: wombat-logs
    - mountPath: /wombat/license.lic_key
      name: wombat-license
    {{- if .Values.wombatConfig.enabled }}
    - mountPath: /wombat/_build/default/rel/wombat/files
      name: wombat-config
    {{- end }}
    ports:
    - containerPort: 8080
    env:
    - name: WOMBAT_NODENAME
      value: wombat@0.0.0.0
    - name: SERVICE_NAME
      value: {{ .Values.kubernetesDiscovery.service }}
    - name: CLUSTER_COOKIE
      value: {{ .Values.kubernetesDiscovery.cookie }}
    - name: APPLICATION_NAME
      value: {{ .Values.kubernetesDiscovery.appname }}
    - name: NAMESPACE
      value: {{ .Values.kubernetesDiscovery.namespace }}
    - name: ERL_EPMD_PORT
      value: {{ .Values.epmdPort | default 4369 | quote }}
    {{- if .Values.kubernetesDiscovery.nodeExpiryHours }}
    - name: NODE_EXPIRY_HOURS
      value: {{ .Values.kubernetesDiscovery.nodeExpiryHours | quote }}
    {{- end }}
  volumes:
  - name: wombat-data
    hostPath:
      path: {{ .Values.hostPath }}/data
      type: DirectoryOrCreate
  - name: wombat-logs
    hostPath:
      path: {{ .Values.hostPath }}/logs
      type: DirectoryOrCreate
  - name: wombat-license
    hostPath:
      path: {{ .Values.hostPath }}/license.lic_key
      type: File
  {{- if .Values.wombatConfig.enabled }}
  - name: wombat-config
    hostPath:
      path: {{ .Values.hostPath }}/config
      type: DirectoryOrCreate
  {{- end }}